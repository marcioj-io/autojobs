name: AutoJobs Worker CI

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'

jobs:
  worker-run:
    name: Build & Run Worker Pipeline
    runs-on: ubuntu-latest

    env:
      RUN_ID: ${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      # Worker é o único executor do domínio agora
      - name: Run Worker pipeline
        run: pnpm --filter @autojobs/worker start