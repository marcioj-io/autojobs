name: Migrations

on:
  push:
    paths:
      - 'packages/db/migrations/**'
  workflow_dispatch: {}

jobs:
  validate-sql:
    name: Validate SQL migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: |
          corepack enable
          pnpm install
      - name: Validate migrations locally with SQLite
        run: |
          pnpm --filter @autojobs/db run validate:migrations

  deploy-to-d1:
    name: Apply migrations to Cloudflare D1 (manual)
    runs-on: ubuntu-latest
    needs: validate-sql
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: |
          corepack enable
          pnpm install
      - name: Run migrations against Cloudflare D1
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "This job should run the migration runner against a real D1 binding."
          echo "Implement a script that authenticates with Cloudflare and calls runMigrations(D1) or use Wrangler to run SQL."
